# Bases locales de l'atlas (ADR 0003 et 0010). Deux bases distinctes :
# - db-ref : base de référence (données importées et validées), migrée depuis `main` seulement ;
# - db-dev : base de développement jetable pour les branches.
# Les identifiants viennent de `.env` (copie de `.env.example`).

name: atlas

x-postgis: &postgis
  image: postgis/postgis:18-3.6
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 2s
    timeout: 5s
    retries: 30

x-dbmate: &dbmate
  image: ghcr.io/amacneil/dbmate:2.36.0
  profiles: ["tools"]
  volumes:
    - ./db/migrations:/db/migrations:ro
  environment: &dbmate-env
    DBMATE_MIGRATIONS_DIR: /db/migrations
    DBMATE_NO_DUMP_SCHEMA: "true"
    DBMATE_WAIT: "true"

services:
  db-ref:
    <<: *postgis
    environment:
      POSTGRES_USER: ${ATLAS_REF_USER:?voir .env.example}
      POSTGRES_PASSWORD: ${ATLAS_REF_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${ATLAS_REF_DB:?voir .env.example}
    ports:
      - "127.0.0.1:${ATLAS_REF_PORT:-5432}:5432"
    volumes:
      - atlas-ref:/var/lib/postgresql

  db-dev:
    <<: *postgis
    environment:
      POSTGRES_USER: ${ATLAS_DEV_USER:?voir .env.example}
      POSTGRES_PASSWORD: ${ATLAS_DEV_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${ATLAS_DEV_DB:?voir .env.example}
    ports:
      - "127.0.0.1:${ATLAS_DEV_PORT:-5433}:5432"
    volumes:
      - atlas-dev:/var/lib/postgresql

  dbmate-ref:
    <<: *dbmate
    environment:
      <<: *dbmate-env
      DATABASE_URL: postgres://${ATLAS_REF_USER}:${ATLAS_REF_PASSWORD}@db-ref:5432/${ATLAS_REF_DB}?sslmode=disable
    depends_on:
      db-ref:
        condition: service_healthy

  dbmate-dev:
    <<: *dbmate
    environment:
      <<: *dbmate-env
      DATABASE_URL: postgres://${ATLAS_DEV_USER}:${ATLAS_DEV_PASSWORD}@db-dev:5432/${ATLAS_DEV_DB}?sslmode=disable
    depends_on:
      db-dev:
        condition: service_healthy

volumes:
  atlas-ref:
  atlas-dev:
