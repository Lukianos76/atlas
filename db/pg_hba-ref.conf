# Authentification de la base de référence (docs/schema.md, §5.13).
# Monté en lecture seule dans le conteneur db-ref et désigné par `-c hba_file`,
# il remplace le pg_hba.conf de l'image, qui accepte sans mot de passe les
# connexions locales et en boucle locale (`trust`). Ici, toute connexion,
# y compris par `docker exec` dans le conteneur, exige un mot de passe.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             all                     scram-sha-256
