# Intégration continue, découpée par chemin (ADR 0005). Chaque job appelle
# `check.sh` : les vérifications sont définies une seule fois, en local et en CI.
# Seul le job `ci-ok` est à déclarer obligatoire dans la protection de `main`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      pipelines: ${{ steps.filter.outputs.pipelines }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            common: &common
              - check.sh
              - scripts/lib.sh
              - .github/**
              - .node-version
              - .gitattributes
            web:
              - *common
              - apps/web/**
            pipelines:
              - *common
              - pipelines/**
            db:
              - *common
              - db/**
              - compose.yaml
              - .env.example
              - scripts/db-*.sh
              - scripts/check-migrations.sh

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Dépendances
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Navigateur Playwright
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Vérifications
        run: bash check.sh --web

  pipelines:
    needs: changes
    if: needs.changes.outputs.pipelines == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: pipelines
          enable-cache: true
      - name: Vérifications
        run: bash check.sh --pipelines

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet pour le garde-fou d'immuabilité
      - name: Vérifications
        run: bash check.sh --db

  ci-ok:
    needs: [changes, web, pipelines, db]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Résultat
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "Un job a échoué ou a été annulé." >&2; exit 1 ;;
            esac
          done
