# Claude Code dans GitHub Actions (CLAUDE.md, section « Mode CI »).
# Déclenché par « @claude » dans une issue ou une PR, par le mainteneur seul.
# Authentification par l'abonnement Claude (token OAuth), jamais par clé API.
name: Claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review_comment:
    types: [created]

# GITHUB_TOKEN en lecture seule : les écritures passent par le token de l'App
# Claude, obtenu par OIDC et de portée explicite (additional_permissions).
permissions:
  contents: read

jobs:
  claude:
    # Le mainteneur seul : login ET identifiant numérique (un login peut être
    # renommé puis repris), auteur du commentaire ou de l'issue, et sujet ouvert
    # par lui-même ou par Claude (« claude[bot] » : les crochets sont interdits
    # dans un login humain, seul un bot d'App peut porter ce nom).
    if: >-
      github.actor == 'Lukianos76' && github.actor_id == '41002025' &&
      github.triggering_actor == 'Lukianos76' &&
      (
        (github.event_name == 'issue_comment' &&
          github.event.comment.user.id == 41002025 &&
          contains(github.event.comment.body, '@claude') &&
          (github.event.issue.user.id == 41002025 || github.event.issue.user.login == 'claude[bot]')) ||
        (github.event_name == 'pull_request_review_comment' &&
          github.event.comment.user.id == 41002025 &&
          contains(github.event.comment.body, '@claude') &&
          (github.event.pull_request.user.id == 41002025 || github.event.pull_request.user.login == 'claude[bot]')) ||
        (github.event_name == 'issues' &&
          github.event.issue.user.id == 41002025 &&
          contains(github.event.issue.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Au niveau du job : un événement écarté par le `if` n'entre pas dans le
    # groupe, et ne peut donc pas annuler un run du mainteneur en attente.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read # lecture des résultats de CI par Claude
      id-token: write # OIDC : échange contre le token de l'App Claude
    env:
      # Nettoyage, au mieux, des secrets Anthropic, cloud et GitHub Actions de
      # l'environnement des commandes lancées par Claude (docs/security.md de l'action).
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet pour le garde-fou d'immuabilité des migrations
          # Sans jeton persistant : celui que checkout v7 laisse dans la config git
          # n'est pas retiré par l'action et primait sur le token de l'App (push
          # refusé en 403 au run de l'issue #8).
          persist-credentials: false

      # Outillage identique à ci.yml : check.sh tourne comme en local (les hooks
      # sont désactivés, voir claude_args).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: pipelines
          enable-cache: true
      - name: Dépendances
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium
          uv sync --directory pipelines --locked

      # Requis par CLAUDE_CODE_SUBPROCESS_ENV_SCRUB (bac à sable de Bash) : l'action
      # ne les installe que pour allowed_non_write_users, que ce workflow n'utilise pas.
      - name: Isolation des sous-processus (bubblewrap, socat)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restreint les espaces de noms utilisateur non privilégiés.
          # Levée sans effet réel sur ce runner éphémère, où sudo est déjà sans mot de
          # passe ; c'est la condition pour que bwrap crée ses espaces de noms.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Seuls les commentaires du mainteneur et de Claude sont transmis.
          include_comments_by_actor: Lukianos76,claude[bot]
          # Portée explicite du token de l'App : contents, pull_requests, issues
          # (écriture, par défaut) et actions (lecture), rien d'autre.
          additional_permissions: |
            actions: read
          branch_prefix: claude/
          # Hooks désactivés : ils s'exécutent hors du bac à sable de Bash et lancent
          # du code du repo (node_modules, uv run) ; check.sh fait foi. Passé en
          # ligne de commande, le réglage prime sur .claude/settings.json.
          # Outils MCP GitHub : ils doivent figurer ici pour que l'action démarre le serveur.
          claude_args: |
            --settings '{"disableAllHooks": true}'
            --append-system-prompt "Tu tournes en CI : applique la section « Mode CI » de CLAUDE.md."
            --allowedTools "mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__get_pull_request,mcp__github__list_pull_requests,mcp__github__search_pull_requests,mcp__github__create_pull_request"
            --disallowedTools "mcp__github__merge_pull_request"
          # Commandes autorisées en plus de celles de l'action (Read, Grep, Glob,
          # git add/commit/rm, push par son script). L'édition est autorisée
          # explicitement, limitée au répertoire du repo : le mode acceptEdits de
          # l'action n'a pas suffi (Write et Edit refusés au run 39122848362).
          # Exclus d'Edit et Write : .github/workflows, .git (config, hooks), .claude,
          # .mcp.json (serveurs lancés hors du bac à sable, activés d'office par
          # l'action), les dépendances installées et les lockfiles.
          # Bac à sable de Bash : réseau limité à PyPI (lecture seule ; reste un canal
          # à faible débit par les statistiques de téléchargement, jugé acceptable) et
          # écriture dans le cache de uv, pour l'outil REUSE que check.sh lance par uvx.
          # Le socket Docker reste fermé (accès équivalent à root).
          settings: |
            {
              "sandbox": {
                "network": {
                  "allowedDomains": ["pypi.org", "files.pythonhosted.org"]
                },
                "filesystem": {
                  "allowWrite": ["${{ runner.temp }}/setup-uv-cache"]
                }
              },
              "permissions": {
                "allow": [
                  "Edit(./**)",
                  "Write(./**)",
                  "Agent",
                  "WebFetch",
                  "WebSearch",
                  "Bash(bash check.sh:*)",
                  "Bash(pnpm --dir apps/web install --frozen-lockfile)",
                  "Bash(pnpm --dir apps/web typecheck:*)",
                  "Bash(pnpm --dir apps/web lint:*)",
                  "Bash(pnpm --dir apps/web format:*)",
                  "Bash(pnpm --dir apps/web test:*)",
                  "Bash(pnpm --dir apps/web e2e:*)",
                  "Bash(uv sync --directory pipelines --locked)",
                  "Bash(uv run --directory pipelines ruff:*)",
                  "Bash(uv run --directory pipelines pyright:*)",
                  "Bash(uv run --directory pipelines pytest:*)",
                  "Bash(git status:*)",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git mv:*)",
                  "Bash(ls:*)"
                ],
                "deny": [
                  "Bash(git push:*)",
                  "Bash(git rebase:*)",
                  "Bash(git reset:*)",
                  "Bash(git -c*)",
                  "Bash(git * -c *)",
                  "Bash(git * --output*)",
                  "Bash(git * -o *)",
                  "Bash(gh:*)",
                  "Bash(curl:*)",
                  "Bash(wget:*)",
                  "Bash(docker:*)",
                  "Edit(.github/workflows/**)",
                  "Write(.github/workflows/**)",
                  "Edit(.git/**)",
                  "Write(.git/**)",
                  "Edit(.claude/**)",
                  "Write(.claude/**)",
                  "Edit(**/node_modules/**)",
                  "Write(**/node_modules/**)",
                  "Edit(pipelines/.venv/**)",
                  "Write(pipelines/.venv/**)",
                  "Edit(apps/web/pnpm-lock.yaml)",
                  "Write(apps/web/pnpm-lock.yaml)",
                  "Edit(pipelines/uv.lock)",
                  "Write(pipelines/uv.lock)",
                  "Edit(.mcp.json)",
                  "Write(.mcp.json)"
                ]
              }
            }

      # En cas d'échec ou d'interruption, affiche le seul message final du SDK
      # (texte de l'erreur, ou dernière réponse de Claude), sans les sorties
      # d'outils que show_full_output exposerait dans les logs publics.
      - name: Cause de l'échec
        if: failure() || cancelled()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          if [ -f "$EXECUTION_FILE" ]; then
            jq -r '.[] | select(.type == "result") | "\(.subtype) : \((.result | select(. != "")) // .errors // "sans message")"' "$EXECUTION_FILE"
          else
            echo "Pas de fichier de sortie de Claude."
          fi
