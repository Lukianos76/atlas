[project]
name = "atlas-pipelines"
version = "0.0.0"
description = "Pipelines d'import de données de l'atlas (ADR 0006)."
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "psycopg[binary]>=3.3.6",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "db: invariants du schéma, sur une base de db-dev désignée par ATLAS_TEST_DB (docs/schema.md)",
]
